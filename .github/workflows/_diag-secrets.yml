name: Diag Secrets
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "KEYSTORE_BASE64 长度: ${#ANDROID_KEYSTORE_BASE64}"
          echo "KEYSTORE_PASSWORD 长度: ${#ANDROID_KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS 长度: ${#ANDROID_KEY_ALIAS}"
          echo "--- PASSWORD 前2后2字符(看是否截断) ---"
          echo "PASSWORD 首尾: ${ANDROID_KEYSTORE_PASSWORD:0:2}...${ANDROID_KEYSTORE_PASSWORD: -2}"
          echo "ALIAS 值: ${ANDROID_KEY_ALIAS}"
          echo "--- 尝试用 secret 密码解码 keystore ---"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 -d > /tmp/k.jks
          echo "keystore 字节数: $(wc -c < /tmp/k.jks)"
          echo "--- 用 keytool + secret 密码验证 ---"
          keytool -list -keystore /tmp/k.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | head -5 || echo "keytool 验证失败(密码不对)"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
